name: Windows 앱 빌드

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri -> target
      - run: npm ci
      - name: Tauri 빌드
        run: npm run tauri -w @doona/web -- build
        env:
          # 설치 후 로그인 화면에 미리 채워질 서버 주소 (저장소 Variables: DOONA_SERVER_URL=https://dona.cam)
          VITE_DEFAULT_SERVER: ${{ vars.DOONA_SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: doona-windows
          path: |
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
            apps/web/src-tauri/target/release/bundle/msi/*.msi
